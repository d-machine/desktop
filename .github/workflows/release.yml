name: Build and Deploy

on:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install Python dependencies
        working-directory: backend
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller

      - name: Build Python backend with PyInstaller
        working-directory: backend
        run: pyinstaller arthdesk.spec --distpath dist --workpath build

      - name: Copy backend to Tauri resources
        run: |
          xcopy /E /I /Y backend\dist\backend src-tauri\backend

      - name: Install frontend dependencies
        run: npm ci

      - name: Build Tauri app
        run: npm run tauri:build
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Rename installer to versioned name
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $exe = Get-ChildItem -Path "src-tauri/target/release/bundle/nsis" -Filter "*.exe" | Select-Object -First 1
          $dest = "src-tauri/target/release/bundle/nsis/ArthaDesk-Setup-$tag.exe"
          Rename-Item $exe.FullName $dest

      - name: Upload installer artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: src-tauri/target/release/bundle/nsis/ArthaDesk-Setup-*.exe
          retention-days: 7

  deploy:
    runs-on: ubuntu-latest
    needs: build-windows

    steps:
      - name: Download installer artifact
        uses: actions/download-artifact@v4
        with:
          name: windows-installer
          path: ./installer

      - name: Deploy versioned exe to VPS
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: "installer/*.exe"
          target: "/home/dmachine/workspace/data/executables/"
          strip_components: 1

      - name: Update latest symlink on VPS
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            cd /home/dmachine/workspace/data/executables
            latest=$(ls -t ArthaDesk-Setup-v*.exe | head -1)
            ln -sf "$latest" ArthaDesk-Setup.exe
            echo "Latest: $latest"
